<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ClawMe 值班台</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/duty.css">
</head>
<body>
  <section id="connect" class="connect">
    <div class="brand-mark">CM</div>
    <p class="eyebrow">AI DUTY DESK</p>
    <h1>AI 干活，需要你时才叫你。</h1>
    <p class="lead">连接你的 ClawMe Agent，随时查看任务、处理授权并继续对话。</p>
    <form id="connectForm" class="connect-card">
      <label for="baseUrl">Relay 地址</label>
      <input id="baseUrl" type="url" value="https://api.clawme.net" required>
      <label for="token">配对 Token</label>
      <input id="token" type="password" autocomplete="current-password" required>
      <button type="submit" class="button primary">进入值班台</button>
      <p id="connectError" class="error"></p>
    </form>
  </section>

  <div id="desk" class="desk hidden">
    <header class="topbar">
      <div>
        <p class="eyebrow">CLAWME</p>
        <h1>AI 值班台</h1>
      </div>
      <div class="top-actions">
        <span id="connection" class="connection">连接中</span>
        <button id="settings" class="icon-button" aria-label="连接设置">⋯</button>
      </div>
    </header>

    <main>
      <section id="dutyPanel" class="panel">
        <div class="section-title">
          <div>
            <p class="eyebrow">NEEDS YOU</p>
            <h2>等你处理</h2>
          </div>
          <span id="attentionCount" class="count">0</span>
        </div>
        <div id="attentionList" class="stack"></div>

        <div class="section-title tasks-title">
          <div>
            <p class="eyebrow">LIVE TASKS</p>
            <h2>任务动态</h2>
          </div>
          <button id="refresh" class="text-button">刷新</button>
        </div>
        <div id="taskList" class="stack"></div>
      </section>

      <section id="machinesPanel" class="panel hidden">
        <div class="section-title">
          <div>
            <p class="eyebrow">COMPUTERS</p>
            <h2>我的电脑</h2>
          </div>
        </div>
        <div id="machineList" class="stack"></div>
      </section>
    </main>

    <nav class="tabs">
      <button class="tab active" data-panel="dutyPanel"><span>◉</span>值班</button>
      <button class="tab" data-panel="machinesPanel"><span>▣</span>设备</button>
    </nav>

    <dialog id="taskDialog">
      <button id="closeTask" class="dialog-close" aria-label="关闭">×</button>
      <p id="taskProvider" class="eyebrow"></p>
      <h2 id="taskTitle"></h2>
      <p id="taskSummary" class="dialog-summary"></p>
      <div id="eventList" class="timeline"></div>
      <form id="messageForm" class="message-form">
        <input id="messageText" placeholder="补充指令给 AI…" autocomplete="off">
        <button class="button primary" type="submit">发送</button>
      </form>
    </dialog>
  </div>

  <script type="module" src="/js/duty.js"></script>
</body>
</html>
